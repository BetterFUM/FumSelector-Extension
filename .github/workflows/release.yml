name: Release extension

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.3.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate extension files
        run: |
          node --check content.js
          python3 -m json.tool manifest.json >/dev/null

      - name: Build installable ZIP
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist
          zip -r "dist/FumSelector-Extension-${RELEASE_TAG}.zip" \
            manifest.json content.js content.css fonts README.md \
            CHANGELOG.md RELEASE_NOTES.md demo.html docs

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "${RELEASE_TAG}" \
            "dist/FumSelector-Extension-${RELEASE_TAG}.zip" \
            --target "${GITHUB_SHA}" \
            --title "FumSelector Extension ${RELEASE_TAG#v}" \
            --notes-file RELEASE_NOTES.md
